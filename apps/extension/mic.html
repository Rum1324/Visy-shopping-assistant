<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visy microphone</title>
    <style>
      html, body { height: 100%; margin: 0; background: #000; color: #f5f5f0; font-family: system-ui, sans-serif; }
      body { display: grid; place-items: center; }
      main { text-align: center; max-width: 22rem; padding: 24px; }
      p { margin: 0 0 20px; line-height: 1.45; }
      button {
        font: inherit;
        color: #000;
        background: #f5f5f0;
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        cursor: pointer;
      }
      #err { color: #ff8a8a; min-height: 1.4em; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <p>Visy needs the microphone to talk with you.</p>
      <button type="button" id="allow">Allow microphone</button>
      <p id="err"></p>
    </main>
    <script src="mic.js"></script>
  </body>
</html>
