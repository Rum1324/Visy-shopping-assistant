<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visy</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <canvas class="bg" id="bg" aria-hidden="true"></canvas>
    <button type="button" id="settings-open" class="icon-btn" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
        />
      </svg>
    </button>
    <p id="status" hidden></p>
    <div id="welcome">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="visy-blue" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#d7f0ff"/>
            <stop offset="0.4" stop-color="#5abeFF"/>
            <stop offset="1" stop-color="#2a6fe0"/>
          </linearGradient>
        </defs>
        <path d="M16 15h6.4L32 47.2 41.6 15H48L33.7 53h-3.4L16 15z"/>
        <path d="M31.2 6.2 32 4.4l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8-1.8-.8 1.8-.8z"/>
      </svg>
      <p id="welcome-line" aria-live="polite"></p>
    </div>
    <div id="chat">
      <ol id="options"></ol>
      <div id="log" aria-live="polite" aria-label="Conversation"></div>
      <section id="checkout" hidden>
        <p id="checkout-text"></p>
        <button type="button" id="confirm">The total matches. I will press Place order myself.</button>
      </section>
    </div>
    <section id="settings" hidden aria-label="Settings">
      <header class="settings-head">
        <button type="button" id="settings-back" class="icon-btn" aria-label="Back" title="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 6 9 12l6 6"
            />
          </svg>
        </button>
        <h1>Settings</h1>
      </header>
      <div class="settings-body">
        <label class="setting" for="speech-rate">
          <span class="setting-title">Voice speed</span>
          <span class="setting-hint">Cartesia TTS. Faster helps many screen-reader users.</span>
          <div class="speed-row">
            <span aria-hidden="true">Slow</span>
            <input
              id="speech-rate"
              type="range"
              min="0.6"
              max="1.5"
              step="0.1"
              value="1"
            />
            <span aria-hidden="true">Fast</span>
          </div>
          <output id="speech-rate-value" for="speech-rate">1.0×</output>
        </label>
      </div>
    </section>
    <form id="composer">
      <label class="sr" for="text">Type to Visy</label>
      <input id="text" name="text" autocomplete="off" placeholder="type here" />
      <button type="submit" id="go" class="go" aria-label="Send" title="Send">
        <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 18V7M8 11l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7.5" y="7.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        </svg>
      </button>
    </form>
    <script src="bg.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
