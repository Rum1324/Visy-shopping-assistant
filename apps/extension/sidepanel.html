<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visy</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <canvas class="bg" id="bg" aria-hidden="true"></canvas>
    <p id="status" hidden></p>
    <div id="welcome">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="visy-blue" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#d7f0ff"/>
            <stop offset="0.4" stop-color="#5abeFF"/>
            <stop offset="1" stop-color="#2a6fe0"/>
          </linearGradient>
        </defs>
        <path d="M16 15h6.4L32 47.2 41.6 15H48L33.7 53h-3.4L16 15z"/>
        <path d="M31.2 6.2 32 4.4l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8-1.8-.8 1.8-.8z"/>
      </svg>
      <p id="welcome-line" aria-live="polite"></p>
    </div>
    <div id="chat">
      <ol id="options"></ol>
      <div id="log" aria-live="polite" aria-label="Conversation"></div>
      <section id="checkout" hidden>
        <p id="checkout-text"></p>
        <button type="button" id="confirm">The total matches. I will press Place order myself.</button>
      </section>
    </div>
    <form id="composer">
      <label class="sr" for="text">Type to Visy</label>
      <input id="text" name="text" autocomplete="off" placeholder="type here" />
      <button type="submit" id="go" class="go" aria-label="Send" title="Send">
        <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 18V7M8 11l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7.5" y="7.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        </svg>
      </button>
    </form>
    <script src="bg.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
